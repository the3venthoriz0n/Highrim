name: Release

# Pushing a tag like v0.1.0 (the tagged commit must be on main, or the run stops) is all a release needs: the tag IS the version.
# The run stamps it into CMakeLists.txt, vcpkg.json, src/main.cpp and tools/make_archive.ps1, builds the plugin on Windows, runs the tests, packages
# dist/Highrim-<version>.zip, creates a GitHub release with it, and (when configured)
# uploads it to Nexus Mods as a new version of an existing file.
#
# One-time setup (see README, "Releasing"):
#   secret   NEXUSMODS_API_KEY   your Nexus API key
#   variable NEXUS_FILE_ID       ID of the file to add versions to (upload the first file by hand)
#   variable NEXUS_MOD_ID        Nexus mod ID (only needed to post the changelog)
# Without them the Nexus step is skipped and the release is still made.
#
# Run manually from the Actions tab to build and package without releasing or uploading.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # vcpkg builds its dependencies from source; keep the built packages between runs. The cache is
      # keyed on the manifest, so a dependency change rebuilds only what changed.
      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on main; nothing was published." }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Tag $env:GITHUB_REF_NAME must look like v1.2.3"
            }
            $v = $Matches[1]
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'project\(Highrim VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
            if (-not $m) { throw "Could not read the version from CMakeLists.txt" }
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Stamp the version into the sources
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          function Stamp([string]$path, [string]$pattern, [string]$replacement) {
            $text = [System.IO.File]::ReadAllText((Join-Path $PWD $path))
            $rx = [regex]$pattern
            if ($rx.Matches($text).Count -ne 1) { throw "Expected exactly one version match in $path" }
            [System.IO.File]::WriteAllText((Join-Path $PWD $path), $rx.Replace($text, $replacement))
            Write-Host "Stamped $path -> $v"
          }
          Stamp 'CMakeLists.txt' '(project\(Highrim VERSION )[0-9]+\.[0-9]+\.[0-9]+' ('${1}' + $v)
          Stamp 'vcpkg.json' '("version-string":\s*")[0-9]+\.[0-9]+\.[0-9]+(")' ('${1}' + $v + '${2}')
          Stamp 'src/main.cpp' '("Highrim )[0-9]+\.[0-9]+\.[0-9]+( loading")' ('${1}' + $v + '${2}')
          Stamp 'tools/make_archive.ps1' '(\[string\]\$Version = ")[0-9]+\.[0-9]+\.[0-9]+(")' ('${1}' + $v + '${2}')

      - name: Configure
        shell: pwsh
        run: cmake -S . -B out\build-release -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build out\build-release --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir out\build-release -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: powershell -File tools\make_archive.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: Highrim-${{ steps.ver.outputs.version }}
          path: dist/Highrim-${{ steps.ver.outputs.version }}.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist\Highrim-${{ steps.ver.outputs.version }}.zip" --generate-notes --title "Highrim ${{ steps.ver.outputs.version }}"

      - name: Upload to Nexus Mods
        if: github.ref_type == 'tag' && env.NEXUS_KEY != '' && vars.NEXUS_FILE_ID != ''
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: dist/Highrim-${{ steps.ver.outputs.version }}.zip
          version: ${{ steps.ver.outputs.version }}
          display_name: Highrim ${{ steps.ver.outputs.version }}
          description: Highrim ${{ steps.ver.outputs.version }}
          category: main
          update_mod_version: "true"
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          changelog: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Commit the version bump back to main
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt vcpkg.json src/main.cpp tools/make_archive.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Sources already at this version"; exit 0 }
          git commit -m "Bump version to ${{ steps.ver.outputs.version }} (release $env:GITHUB_REF_NAME)"
          git push origin HEAD:main
